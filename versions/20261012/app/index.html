<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff">
<title>城市收藏 · yoxi</title>
<link rel="icon" href="assets/yoxi-logo.svg"><link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="preview.css"></head>
<body><aside class="preview-ribbon" aria-label="預覽說明"><span>網頁預覽 · 操作資料只存在這個瀏覽器</span><nav aria-label="版本導覽"><a href="../index.html#demo">Demo 影片</a><a href="../index.html">新版成果</a></nav></aside>
<header class="topbar"><a class="brand" href="city.html#explore" aria-label="yoxi 城市生活"><img src="assets/yoxi-logo.svg" alt="yoxi"><span>城市收藏</span></a><nav class="collection-nav" aria-label="主要功能"><a href="city.html#explore"><i data-icon="compass"></i><span>探索</span></a><a href="city.html#together"><i data-icon="people"></i><span>一起去</span></a><a href="index.html" aria-current="page"><i data-icon="spark"></i><span>城市收藏</span></a><a href="city.html#me"><i data-icon="album"></i><span>我的</span></a></nav><button class="album-button" id="open-album"><i data-icon="album"></i><span>收藏冊</span><span class="count" id="album-count" hidden>0</span></button></header>
<main id="main">
<section id="studio" class="studio" aria-labelledby="scene-title">
  <div class="scene-stage" id="scene-stage">
    <div class="scene-heading"><p class="location" id="scene-location">以台南藍晒圖為靈感</p><div class="heading-row"><h1 id="scene-title" tabindex="-1">藍色街角</h1><button class="change-scene" id="choose-scene" aria-label="選擇城市場景"><i data-icon="chevron"></i></button></div><p class="scene-line" id="scene-line">把喜歡的光線與角度，留成自己的紀念。</p></div>
    <div id="world" role="img" aria-label="可轉動的城市收藏場景"></div>
    <div class="world-loading" id="world-loading"><span class="loader"></span><span>打開街角</span></div>
    <div class="scene-meta"><button id="about-scene" class="icon-button glass" aria-label="關於這件收藏"><i data-icon="info"></i></button></div>
    <div class="angle-control"><button class="icon-button" id="turn-left" aria-label="向左轉動場景"><i data-icon="rotate-left"></i></button><label><span>轉個角度</span><input id="angle" type="range" min="-100" max="100" value="0" aria-label="場景角度"></label><button class="icon-button" id="turn-right" aria-label="向右轉動場景"><i data-icon="rotate-right"></i></button></div>
    <div class="scene-strip" id="scene-strip" aria-label="城市場景"></div>
    <div class="game-stage-top" id="game-stage-top" hidden><button id="end-game" class="glass game-exit"><i data-icon="back"></i>結束遊戲</button><span class="game-mode-info"><span id="game-mode-label">紙鳥小遊戲</span><span id="game-wind" class="game-wind" hidden>出手側風向右 <span aria-hidden="true">→</span></span></span></div>
    <div class="game-announcement" id="game-announcement" hidden role="status"><span id="game-announcement-text"></span></div>
    <div id="game-progress" class="game-progress" aria-live="polite"></div><div class="shutter-flash" aria-hidden="true"></div>
  </div>
  <aside class="studio-panel" aria-label="旅伴與操作">
    <div id="studio-home-controls">
      <div class="companion-header"><button class="companion-profile" id="open-companion"><span class="companion-mark"><i data-icon="paw"></i></span><span class="companion-profile-copy"><strong>我的城市旅伴</strong><span id="companion-level">旅伴 1 級</span></span><i data-icon="chevron"></i></button><button id="focus-companion" class="focus-companion" aria-pressed="false"><i data-icon="focus"></i><span>近看旅伴</span></button></div>
      <div class="companion-intro"><button class="next-keepsake" id="preview-keepsake"><img id="next-keepsake-image" src="assets/item-badge.png" width="88" height="88" alt=""><span class="next-keepsake-copy"><strong id="next-keepsake-title">藍屋徽章</strong><span id="companion-next">在街角接住一次紙鳥，就能收下。</span></span><i data-icon="chevron"></i></button></div>
      <div class="journey-progress"><div class="journey-progress-line"><span id="progress-label">旅伴成長</span><span id="progress-value">0 / 20</span></div><div class="progress-track"><span id="progress-fill"></span></div></div>
      <div class="studio-actions"><button class="primary play-button" id="start-game"><i data-icon="paper-bird"></i><span>一起玩</span></button><button class="secondary capture-button" id="capture"><i data-icon="camera"></i><span>拍成紀念卡</span></button></div>
      <div class="studio-tools"><button id="open-customize"><i data-icon="sliders"></i><span>調整場景與裝扮</span><i data-icon="chevron"></i></button><button id="open-keepsakes"><i data-icon="bag"></i><span>旅行小物</span><span id="owned-count">0 / 3</span></button></div>
      <button class="text-button about-link" id="about-project">關於這段體驗<i data-icon="chevron"></i></button>
    </div>
    <section id="game-controls" class="game-controls" hidden aria-label="紙鳥遊戲操作">
      <p class="location" id="game-location">藍色街角</p><h2 id="game-title">把紙鳥拋給旅伴</h2><p id="game-instruction" class="game-instruction" role="status">往下拉紙鳥，放開就拋出。</p>
      <div id="game-error" class="error game-error" hidden role="alert" tabindex="-1"><p id="game-error-text"></p><button class="text-button" id="retry-game-progress" hidden>重新保存進度</button></div>
      <div id="throw-controls"><div class="origin-control" aria-label="站的位置"><button data-origin="left" aria-pressed="false">左邊</button><button data-origin="center" aria-pressed="true">中間</button><button data-origin="right" aria-pressed="false">右邊</button></div>
      <div class="throw-pad" id="throw-pad" role="group" aria-label="拖曳紙鳥調整方向與力道"><div class="throw-guide" aria-hidden="true"><svg viewBox="-60 -65 120 90"><line id="aim-vector" x1="0" y1="0" x2="0" y2="-44"/><path id="aim-head" d="M-5 -36 0 -44 5 -36"/></svg></div><div class="throw-bird" id="throw-bird" aria-hidden="true"><i data-icon="paper-bird"></i></div><span class="throw-pad-label" id="throw-pad-label">向後拉，放開沿箭頭拋出</span></div>
      <button class="primary" id="throw-button"><i data-icon="paper-bird"></i><span>拋出紙鳥</span></button>
      <details class="aim-details"><summary>調整角度與力道<i data-icon="chevron"></i></summary><label>方向<input id="aim-direction" type="range" min="-1" max="1" step="0.01" value="0"></label><label>高低<input id="aim-elevation" type="range" min="0" max="1" step="0.01" value="0.4"></label><label>力道<input id="aim-power" type="range" min="0" max="1" step="0.01" value="0.5"></label><button class="text-button" id="reset-aim">回到起始角度</button></details></div>
      <div class="catch-controls" id="catch-controls" hidden><label for="catch-position">移動位置，接住回來的紙鳥</label><input id="catch-position" type="range" min="-1" max="1" step="0.01" value="0"><button class="primary" id="resume-catch" hidden>繼續接回</button></div>
      <button class="secondary" id="game-window" hidden>推開窗，試試側風</button>
    </section>
  </aside>
</section>
<section id="album-view" class="album-view" hidden aria-labelledby="album-title"><div class="album-heading"><button class="back-button" id="back-studio"><i data-icon="back"></i>回到街角</button><div class="album-title-row"><div><p class="location">留住喜歡的片刻</p><h1 id="album-title" tabindex="-1">我的收藏冊</h1></div><div class="album-actions"><span id="album-total"></span><button class="primary" id="new-card"><i data-icon="camera"></i>拍新的一張</button></div></div></div><div id="album-grid" class="album-grid"></div><div class="album-empty" id="album-empty"><div class="empty-card" aria-hidden="true"><i data-icon="camera"></i></div><h2>第一張，就從這個街角開始。</h2><button class="primary" id="empty-start">去拍一張</button></div></section>
</main>
<dialog id="customize-dialog" class="customize-dialog"><form method="dialog"><button class="dialog-close icon-button" aria-label="關閉"><i data-icon="close"></i></button></form><div class="sheet-heading"><p class="location">屬於你的街角</p><h2>場景與裝扮</h2></div>
<div class="control-tabs" role="tablist" aria-label="場景設定"><button role="tab" id="tab-light" aria-selected="true" aria-controls="panel-light" data-control="light">光線</button><button role="tab" id="tab-outfit" aria-selected="false" aria-controls="panel-outfit" data-control="outfit">裝扮</button><button role="tab" id="tab-pose" aria-selected="false" aria-controls="panel-pose" data-control="pose">動作</button><button role="tab" id="tab-setting" aria-selected="false" aria-controls="panel-setting" data-control="setting" hidden>場景</button></div>
<div class="setting-group control-pane active" id="panel-light" data-pane="light" role="tabpanel" aria-labelledby="tab-light"><div class="segmented" id="light-controls" role="group" aria-label="光線"><button data-light="day" aria-pressed="true"><i data-icon="sun"></i>日光</button><button data-light="sunset" aria-pressed="false"><i data-icon="sunset"></i>夕照</button><button data-light="night" aria-pressed="false"><i data-icon="moon"></i>夜色</button></div></div>
<div class="setting-group control-pane" id="panel-outfit" data-pane="outfit" role="tabpanel" aria-labelledby="tab-outfit" hidden><div class="outfit-options" id="outfit-controls" role="group" aria-label="旅伴的裝扮"><button data-outfit="scarf" aria-pressed="true"><span class="outfit-symbol"><i data-icon="scarf"></i></span><span>戴領巾</span></button><button data-outfit="camera" aria-pressed="false"><span class="outfit-symbol"><i data-icon="camera"></i></span><span>帶相機</span></button><button data-outfit="umbrella" aria-pressed="false"><span class="outfit-symbol"><i data-icon="umbrella"></i></span><span>撐把傘</span></button></div></div>
<div class="pose-row control-pane" id="panel-pose" data-pane="pose" role="tabpanel" aria-labelledby="tab-pose" hidden><button data-pose="wave" aria-pressed="true">打個招呼</button><button data-pose="sit" aria-pressed="false">坐一會</button><button data-pose="walk" aria-pressed="false">走走看看</button><button data-pose="show-bag" aria-pressed="false" id="show-bag" hidden>看看旅行包</button></div>
<div class="setting-group control-pane" id="panel-setting" data-pane="setting" role="tabpanel" aria-labelledby="tab-setting" hidden><div class="segmented"><button id="toggle-window" aria-pressed="false">推開窗</button><button id="toggle-rain" aria-pressed="true">屋簷滴水</button></div></div><button class="primary" id="done-customize">完成</button></dialog>
<dialog id="companion-dialog" class="companion-dialog"><form method="dialog"><button class="dialog-close icon-button" aria-label="關閉"><i data-icon="close"></i></button></form><div class="sheet-heading"><p class="location">我的城市旅伴</p><h2 id="companion-dialog-title">旅行中的小收穫</h2></div><div id="companion-summary" class="companion-summary"></div><div class="companion-tabs" role="tablist" aria-label="旅伴內容"><button role="tab" aria-selected="true" data-companion-tab="items">旅行小物</button><button role="tab" aria-selected="false" data-companion-tab="tasks">成長與玩法</button></div><div id="keepsake-grid" class="keepsake-grid"></div><div id="companion-tasks" hidden></div><p id="companion-storage" class="error" hidden role="alert"></p><button id="retry-progress" class="secondary" hidden>重試儲存進度</button></dialog>
<dialog id="item-dialog" class="item-dialog" aria-labelledby="item-title"><form method="dialog"><button class="dialog-close icon-button" aria-label="關閉"><i data-icon="close"></i></button></form><div id="item-viewer" class="item-viewer"></div><div class="item-copy"><p class="location" id="item-status"></p><h2 id="item-title" tabindex="-1"></h2><p id="item-description"></p><p id="item-source" class="item-source"></p><div class="acquired-choices" id="acquired-choices" role="group" aria-label="這次收下的小物" hidden></div><button class="primary" id="equip-item"></button><button class="secondary continue-playing" id="continue-playing" hidden>繼續玩</button><button class="text-button" id="turn-item"><i data-icon="rotate-right"></i>看看背面</button></div></dialog>
<dialog id="card-dialog" class="card-dialog"><form method="dialog"><button class="dialog-close icon-button" aria-label="關閉"><i data-icon="close"></i></button></form><div class="card-dialog-layout"><div class="postcard-preview"><div class="missing-image" id="missing-image" hidden><i data-icon="camera"></i><p>圖片無法讀取</p><span>文字與構圖仍保留。</span></div><canvas id="postcard-canvas" width="1200" height="1500" aria-label="紀念卡預覽"></canvas></div><div class="card-details"><p class="location" id="card-status">留住這一刻</p><h2 id="card-title">我的藍色街角</h2><label class="caption-label" for="caption">寫一句話<span>選填</span></label><textarea id="caption" maxlength="70" rows="2" placeholder="今天想慢一點。"></textarea><p class="card-date" id="card-date"></p><button class="primary" id="save-card"><i data-icon="album"></i><span>收進收藏冊</span></button><a class="secondary" id="download-card" download aria-disabled="true"><i data-icon="download"></i><span>下載紀念卡</span></a><button class="secondary" id="share-card" hidden><i data-icon="share"></i><span>分享紀念卡</span></button><div class="card-secondary-actions"><button class="text-button" id="edit-scene"><i data-icon="edit"></i>回去調整</button><button class="text-button danger" id="delete-card" hidden><i data-icon="trash"></i>刪除</button></div><p id="card-error" class="error" role="alert" hidden></p></div></div></dialog>
<dialog id="info-dialog" class="info-dialog"><form method="dialog"><button class="dialog-close icon-button" aria-label="關閉"><i data-icon="close"></i></button></form><h2 id="info-title"></h2><div id="info-content"></div><button class="primary" id="close-info">知道了</button></dialog>
<dialog id="scene-dialog" class="scene-dialog"><form method="dialog"><button class="dialog-close icon-button" aria-label="關閉"><i data-icon="close"></i></button></form><h2>選個喜歡的街角</h2><div id="scene-choices"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.mjs"></script>
</body></html>
